[project]
name = "credigo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chokunnotlikeus", email = "ittikorn.chokun@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "psycopg2>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
credigo = "credigo:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
